<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拾光 · 活动预约</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3f7;color:#182d40;font:16px/1.6 system-ui}header{background:#163b50;color:white;padding:32px max(5%,calc((100% - 1100px)/2))}main{max-width:1100px;margin:auto;padding:24px}section,article{background:white;padding:22px;border-radius:14px;margin:16px 0;box-shadow:0 4px 18px #183b5010}input,select,button,textarea{font:inherit;padding:10px;border:1px solid #b8c9d3;border-radius:7px;margin:5px;max-width:100%}button{cursor:pointer;background:#126c70;color:white}button.secondary{background:#edf3f6;color:#163b50}label{display:inline-block}#list{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}small{color:#526978}h1,h2,h3{margin:0 0 12px}dialog{width:600px;max-width:95%;border:0;border-radius:16px;padding:25px}dialog::backdrop{background:#102a40aa}#message{position:sticky;top:0;background:#d5eee8;padding:12px;z-index:2}textarea{display:block;width:95%}@media(max-width:600px){main{padding:12px}header{padding:24px}input{max-width:90%}}</style><header><small style="color:#a9d9d5">CITY EXPERIENCES / 本地测试空间</small><h1>拾光 · 活动预约</h1><p>给生活留一点探索的时间。</p>固定身份：体验员 A · 单用户模拟 · 无真实报名</header><main><div id="message" role="status">欢迎，选择一场活动开始体验。</div><section><h2>模拟时钟</h2><label>当前时间 <input id="clock" type="datetime-local"></label><button onclick="setTime()">设置时间</button><button onclick="message('模拟时间已推进一天')">推进一天</button><button class="secondary" onclick="reset()">恢复初始测试数据</button><p>固定 UTC+8，不读取设备当前日期。截止时刻仍可提交；开始前 2 小时起不可取消或改期。</p></section><section><h2>发现活动</h2><label>关键词<input id="query" placeholder="活动名称或地点" oninput="renderList()"></label><label>类别<select id="category" onchange="renderList()"><option value="">全部</option><option>手作</option><option>运动</option><option>文化</option></select></label><label>日期<input id="filterDate" type="date" onchange="renderList()"></label><button class="secondary" onclick="clearFilters()">清除筛选</button><div id="list"></div></section><section><h2>我的预约</h2><label>状态<select id="status" onchange="renderOrders()"><option>全部</option><option>待参加</option><option>已取消</option><option>已结束</option></select></label><div id="orders"></div></section><section><h2>预约须知</h2><p>每单 1～4 位整数人数，按人数扣减名额。联系人请填写“测试联系人”。同一身份不能重复预约同一时段。时间区间采用 [开始,结束)，相邻时段不冲突。取消后可重新预约。改期仅限同一活动，成功后释放旧名额；失败保留原预约。已结束记录只可查看。</p></section></main><dialog id="detail"></dialog><script src="app.js"></script></html>
